on: [push, pull_request]
permissions:
  contents: write
name: CI

env:
  PF_INFO: "ascii"
  PF_PAD1: 0
  PF_PAD2: 0
  PF_PAD3: 0

jobs:
  checks:
    name: ${{ matrix.name }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-freebsd
          - aarch64-linux-android
          - x86_64-pc-windows-gnu
          - x86_64-apple-darwin

        include:
          - os: ubuntu-latest
            name: Linux x86_64
            target: x86_64-unknown-linux-gnu
            cross: false
            strip: true

          - os: ubuntu-latest
            name: FreeBSD
            target: x86_64-unknown-freebsd
            cross: true
            strip: true

          - os: ubuntu-latest
            name: Android
            target: aarch64-linux-android
            cross: true
            strip: true

          - os: windows-latest
            name: Windows x86_64
            target: x86_64-pc-windows-gnu
            cross: false
            strip: true

          - os: macos-latest
            name: macOS x86_64
            target: x86_64-apple-darwin
            cross: false
            strip: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: ${{ matrix.cross && 'cross' || 'cargo' }} clippy --target=${{ matrix.target }} -- --no-deps -D clippy::all

      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --target=${{ matrix.target }} --target-dir=/tmp

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pfetch-${{ matrix.target }}
          path: /tmp/${{ matrix.target }}/debug/pfetch

      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --target=${{ matrix.target }}
  render:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Jetbrains Mono
        run: sudo apt update && sudo apt install -y fonts-jetbrains-mono

      - name: Install typst
        uses: typst-community/setup-typst@v4
        with:
          version: 'v0.14.2'

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: pfetch-x86_64-unknown-linux-gnu
          path: /tmp/

      - name: Run render script
        run: sudo chmod +x /tmp/pfetch && cd ./tools/ && ./render_all.sh /tmp/pfetch

      - name: Commit Files
        uses: EndBug/add-and-commit@v9
        with:
          add:
            assets all_logos.md
          default_author: github_actions
          message: "chore(logos): re-render all logos"
